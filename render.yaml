services:
  - type: web
    name: threadlock-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: THREADLOCK_DB_PATH
        value: /app/.threadlock/threadlock.db
      - key: THREADLOCK_SIGNING_KEY_PATH
        value: /app/.threadlock/signing_key.pem
      - key: THREADLOCK_API_KEY
        generateValue: true
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
